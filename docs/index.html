<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>바코드 리더</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<style>
  :root {
    --bg: #F5F7FA;
    --surface: #FFFFFF;
    --surface-2: #EDF0F4;
    --border: #D8DEE6;
    --text: #1A1F26;
    --text-muted: #5B6472;
    --accent: #049775;
    --accent-soft: #E3F5EF;
    --accent-contrast: #FFFFFF;
    --danger: #C4383B;
    --danger-soft: #FBE9E8;
    --laser: #FF3B3B;
    --mono-bg: #12161C;
    --mono-panel: #191F27;
    --mono-text: #E8ECF1;
    --mono-muted: #7C879A;
    --font-display: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1115;
      --surface: #161A21;
      --surface-2: #1D222B;
      --border: #2A303B;
      --text: #E8ECF1;
      --text-muted: #8B93A1;
      --accent: #1FE3B0;
      --accent-soft: #123028;
      --accent-contrast: #062019;
      --danger: #FF6B6E;
      --danger-soft: #3A1A1B;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0F1115;
    --surface: #161A21;
    --surface-2: #1D222B;
    --border: #2A303B;
    --text: #E8ECF1;
    --text-muted: #8B93A1;
    --accent: #1FE3B0;
    --accent-soft: #123028;
    --accent-contrast: #062019;
    --danger: #FF6B6E;
    --danger-soft: #3A1A1B;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }

  .brand h1 {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .brand p {
    margin: 1px 0 0;
    font-size: 12px;
    color: var(--text-muted);
  }

  #db-badge {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 5px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }

  main {
    flex: 1;
    padding: 16px 18px 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ---- Camera / scan area ---- */

  .scan-frame {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: var(--mono-bg);
    aspect-ratio: 4 / 5;
    box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 12px 28px -18px rgba(0,0,0,0.5);
  }

  #interactive {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #interactive video, #interactive canvas {
    position: absolute;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
    object-fit: cover;
  }

  .scan-frame::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 78%, rgba(0,0,0,0.5) 100%);
    opacity: 0;
    transition: opacity .25s ease;
  }

  .scan-frame.is-live::before { opacity: 1; }

  .placeholder {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 24px;
    text-align: center;
    color: var(--mono-muted);
  }

  .placeholder svg { color: var(--accent); opacity: 0.9; }
  .placeholder p { margin: 0; font-size: 13px; line-height: 1.5; color: #C3CAD4; }
  .placeholder.error { color: var(--danger); }
  .placeholder.error p { color: #F0B9BA; }

  .scan-frame.is-live .placeholder { display: none; }

  .laser-track {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: none;
    pointer-events: none;
  }

  .scan-frame.is-live .laser-track { display: block; }

  .laser-line {
    position: absolute;
    left: 6%;
    right: 6%;
    top: 50%;
    height: 2px;
    transform: translateY(-1px);
    background: var(--laser);
    box-shadow: 0 0 8px 1px var(--laser), 0 0 22px 4px rgba(255,59,59,0.55);
    animation: laser-pulse 1.6s ease-in-out infinite;
  }

  @keyframes laser-pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }

  .laser-frame {
    position: absolute;
    left: 6%;
    right: 6%;
    top: 50%;
    height: 84px;
    transform: translateY(-42px);
    border-left: 2px solid rgba(255,59,59,0.9);
    border-right: 2px solid rgba(255,59,59,0.9);
  }

  .readout-chip {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, calc(-50% - 32px));
    max-width: 88%;
    padding: 6px 12px;
    border-radius: 8px;
    background: rgba(18, 22, 28, 0.88);
    border: 1px solid rgba(255,255,255,0.08);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--mono-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color .15s ease, border-color .15s ease;
  }

  .readout-chip.has-value {
    color: #fff;
    border-color: rgba(31,227,176,0.5);
  }

  .readout-chip.flash {
    animation: chip-flash .5s ease;
  }

  @keyframes chip-flash {
    0% { background: rgba(31,227,176,0.35); }
    100% { background: rgba(18, 22, 28, 0.88); }
  }

  /* ---- Controls ---- */

  .toggle-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px 16px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-contrast);
    transition: transform .08s ease, opacity .15s ease;
  }

  .toggle-btn:active { transform: scale(0.98); }
  .toggle-btn.is-stop { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }

  .manual-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .manual-row {
    display: flex;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
  }

  .manual-row input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    padding: 8px 10px;
    font-family: var(--font-mono);
    font-size: 13.5px;
    color: var(--text);
  }

  .manual-row input:focus { outline: none; }
  .manual-row input::placeholder { color: var(--text-muted); font-family: var(--font-display); }

  .manual-row button {
    flex: none;
    border: none;
    border-radius: 8px;
    padding: 0 16px;
    background: var(--surface-2);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .manual-suggestions {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 220px;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
  }

  .manual-suggestions .sg-hint {
    font-size: 11px;
    color: var(--text-muted);
    padding: 4px 6px 2px;
  }

  .suggestion-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    border: none;
    background: var(--surface-2);
    border-radius: 8px;
    padding: 9px 12px;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
  }

  .suggestion-row:active { transform: scale(0.99); }

  .suggestion-row .sg-key {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    flex: none;
  }

  .suggestion-row .sg-value {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }

  /* ---- Readout panel (device screen look, stays dark in both themes) ---- */

  .panel-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
  }

  .readout-panel {
    background: var(--mono-bg);
    border-radius: 14px;
    padding: 4px;
  }

  .readout-row {
    padding: 14px 16px;
  }

  .readout-row + .readout-row {
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .readout-row .rr-label {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--mono-muted);
    margin: 0 0 4px;
  }

  .readout-row .rr-value {
    font-family: var(--font-mono);
    font-size: 19px;
    font-weight: 600;
    color: var(--mono-text);
    font-variant-numeric: tabular-nums;
    word-break: break-all;
    margin: 0;
  }

  .readout-row .rr-value.is-empty {
    font-family: var(--font-display);
    font-size: 13.5px;
    font-weight: 400;
    color: var(--mono-muted);
  }

  .readout-row .rr-value.is-miss {
    color: #FF9B9D;
    font-size: 14.5px;
    font-weight: 500;
  }

  .readout-row .rr-value.is-hit {
    color: #6FF0C4;
  }

  .engine-note {
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    margin: -6px 0 0;
  }

  footer {
    padding: 4px 18px 18px;
    font-size: 11.5px;
    color: var(--text-muted);
    text-align: center;
  }
</style>
</head>

    "S21-134": "WM052534W-52466", "S21-135": "WM052534W-51130", "S22-136": "WM052534W-51376"
  };

  document.getElementById('db-badge').textContent = 'DB ' + Object.keys(barcodeDatabase).length + '건';

  const scanFrame = document.getElementById('scan-frame');
  const interactiveEl = document.getElementById('interactive');
  const placeholder = document.getElementById('placeholder');
  const readoutChip = document.getElementById('readout-chip');
  const toggleBtn = document.getElementById('toggle-btn');
  const toggleIcon = document.getElementById('toggle-icon');
  const toggleLabel = document.getElementById('toggle-label');
  const engineNote = document.getElementById('engine-note');
  const resBarcode = document.getElementById('res-barcode');
  const resSerial = document.getElementById('res-serial');

  const ICON_PLAY = '<polygon points="6 3 20 12 6 21 6 3"></polygon>';
  const ICON_STOP = '<rect x="5" y="5" width="14" height="14" rx="2"></rect>';

  // Code 128은 문자+숫자+하이픈이 섞여도 정확히 읽히는 반면, QuaggaJS의
  // code_128_reader는 이런 혼합 바코드에서 종종 앞/뒤 문자를 놓친다.
  // 브라우저 네이티브 BarcodeDetector(Android Chrome)가 있으면 그걸 우선 쓰고,
  // 지원하지 않는 브라우저(iOS Safari 등)에서만 QuaggaJS로 폴백한다.
  const hasNativeDetector = 'BarcodeDetector' in window;
  let engine = null; // 'native' | 'quagga'
  let isScanning = false;
  let flashTimer = null;
  let nativeStream = null;
  let nativeVideoEl = null;
  let nativeLoopId = null;
  let lastNativeCode = '';
  let lastNativeAt = 0;

  function setResult(code) {
    const trimmed = code.trim();
    if (!trimmed) return;

    // 카메라로 스캔한 값은 등록된 짧은 태그(키)일 수도, 그 태그가 가리키는
    // 시리얼(값)이 직접 인쇄된 경우일 수도 있어 양쪽 다 정확히 일치하는지 확인한다.
    if (barcodeDatabase[trimmed]) {
      applyMatch(trimmed, barcodeDatabase[trimmed]);
      return;
    }
    const exactValueKey = Object.keys(barcodeDatabase).find((k) => barcodeDatabase[k] === trimmed);
    if (exactValueKey) {
      applyMatch(exactValueKey, barcodeDatabase[exactValueKey]);
      return;
    }

    resBarcode.textContent = trimmed;
    resBarcode.className = 'rr-value';
    resSerial.textContent = '등록되지 않은 바코드입니다';
    resSerial.className = 'rr-value is-miss';

    readoutChip.textContent = trimmed;
    readoutChip.classList.add('has-value', 'flash');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => readoutChip.classList.remove('flash'), 500);
  }

  function applyMatch(key, value) {
    resBarcode.textContent = key;
    resBarcode.className = 'rr-value';
    resSerial.textContent = value;
    resSerial.className = 'rr-value is-hit';

    readoutChip.textContent = key;
    readoutChip.classList.add('has-value', 'flash');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => readoutChip.classList.remove('flash'), 500);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // 대소문자 구분 없이, 태그(키)와 시리얼(값) 양쪽 모두에서 부분 문자열을 찾는다.
  function searchDatabase(query) {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    return Object.entries(barcodeDatabase).filter(
      ([key, value]) => key.toLowerCase().includes(q) || value.toLowerCase().includes(q)
    );
  }

  function hideSuggestions() {
    manualSuggestions.hidden = true;
    manualSuggestions.innerHTML = '';
  }

  function renderSuggestions(matches, query) {
    if (!matches.length) {
      hideSuggestions();
      return;
    }
    const shown = matches.slice(0, 8);
    const hint = matches.length > shown.length
      ? `"${escapeHtml(query)}" 일치 ${matches.length}건 중 ${shown.length}건 표시`
      : `"${escapeHtml(query)}" 일치 ${matches.length}건 - 선택하세요`;

    manualSuggestions.innerHTML = '<div class="sg-hint">' + hint + '</div>' + shown.map(([key, value]) => (
      '<button type="button" class="suggestion-row" data-key="' + escapeHtml(key) + '">' +
        '<span class="sg-key">' + escapeHtml(key) + '</span>' +
        '<span class="sg-value">' + escapeHtml(value) + '</span>' +
      '</button>'
    )).join('');
    manualSuggestions.hidden = false;

    manualSuggestions.querySelectorAll('.suggestion-row').forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-key');
        manualInput.value = key;
        applyMatch(key, barcodeDatabase[key]);
        hideSuggestions();
      });
    });
  }

  function showPlaceholder(message, isError) {
    placeholder.querySelector('p').innerHTML = message;
    placeholder.classList.toggle('error', !!isError);
    scanFrame.classList.remove('is-live');
  }

  function describeCameraError(err) {
    const name = err && err.name;
    if (!window.isSecureContext) {
      return 'HTTPS(또는 localhost) 연결이 아니라서 카메라를 사용할 수 없습니다.<br>주소가 https:// 로 시작하는지 확인해주세요.';
    }
    if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
      return '카메라 접근 권한이 거부되었습니다.<br>브라우저 설정에서 이 사이트의 카메라 권한을 허용한 뒤 새로고침 해주세요.';
    }
    if (name === 'NotFoundError' || name === 'OverconstrainedError') {
      return '이 기기에서 사용 가능한 카메라를 찾을 수 없습니다.';
    }
    if (name === 'NotReadableError' || name === 'TrackStartError') {
      return '다른 앱이 카메라를 사용 중입니다.<br>카메라를 쓰는 다른 앱을 종료한 뒤 다시 시도해주세요.';
    }
    return '카메라를 시작할 수 없습니다.<br>브라우저의 카메라 권한을 확인해주세요.';
  }

  function handleManualSearch() {
    const trimmed = manualInput.value.trim();
    if (!trimmed) return;

    // 1) 태그(키) 또는 시리얼(값)과 정확히 일치하면 바로 확정
    if (barcodeDatabase[trimmed]) {
      applyMatch(trimmed, barcodeDatabase[trimmed]);
      hideSuggestions();
      return;
    }
    const exactValueKey = Object.keys(barcodeDatabase).find((k) => barcodeDatabase[k] === trimmed);
    if (exactValueKey) {
      applyMatch(exactValueKey, barcodeDatabase[exactValueKey]);
      hideSuggestions();
      return;
    }

    // 2) 완전히 일치하는 값이 없으면 부분 문자열로 유사/동일 항목을 찾는다
    const matches = searchDatabase(trimmed);
    if (matches.length === 1) {
      applyMatch(matches[0][0], matches[0][1]);
      hideSuggestions();
    } else if (matches.length > 1) {
      renderSuggestions(matches, trimmed);
    } else {
      hideSuggestions();
      resBarcode.textContent = trimmed;
      resBarcode.className = 'rr-value';
      resSerial.textContent = '일치하는 바코드가 없습니다';
      resSerial.className = 'rr-value is-miss';
    }
  }

  const manualInput = document.getElementById('manual-input');
  const manualSuggestions = document.getElementById('manual-suggestions');

  document.getElementById('manual-btn').addEventListener('click', handleManualSearch);
  manualInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleManualSearch();
  });

  // 입력하는 동안에도 두 글자 이상이면 실시간으로 후보를 보여준다
  manualInput.addEventListener('input', () => {
    const q = manualInput.value.trim();
    if (q.length < 2 || barcodeDatabase[q]) {
      hideSuggestions();
      return;
    }
    renderSuggestions(searchDatabase(q), q);
  });

  function onBarcodeDetected(code) {
    if (!code) return;
    setResult(code);
    if (navigator.vibrate) navigator.vibrate(120);
  }

  function markLive() {
    isScanning = true;
    scanFrame.classList.add('is-live');
    toggleBtn.classList.add('is-stop');
    toggleIcon.innerHTML = ICON_STOP;
    toggleLabel.textContent = '스캔 중지';
    readoutChip.textContent = '스캔 대기 중…';
    readoutChip.classList.remove('has-value');
  }

  function resetToggle() {
    isScanning = false;
    toggleBtn.classList.remove('is-stop');
    toggleIcon.innerHTML = ICON_PLAY;
    toggleLabel.textContent = '스캔 시작';
  }

  // ---- Engine A: native BarcodeDetector (정확도 우선) ----

  async function startNativeScanner() {
    try {
      nativeStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 960 }
        },
        audio: false
      });
    } catch (err) {
      console.error(err);
      showPlaceholder(describeCameraError(err), true);
      resetToggle();
      return;
    }

    nativeVideoEl = document.createElement('video');
    nativeVideoEl.setAttribute('playsinline', '');
    nativeVideoEl.setAttribute('muted', '');
    nativeVideoEl.muted = true;
    nativeVideoEl.autoplay = true;
    nativeVideoEl.srcObject = nativeStream;
    interactiveEl.innerHTML = '';
    interactiveEl.appendChild(nativeVideoEl);

    try {
      await nativeVideoEl.play();
    } catch (err) {
      // Safari 등에서 autoplay가 막히면 첫 터치 이후 자동 재생됨 - 치명적이지 않음
    }

    let detector;
    try {
      detector = new BarcodeDetector({
        formats: ['code_128', 'ean_13', 'ean_8', 'code_39', 'upc_a', 'upc_e']
      });
    } catch (err) {
      // 이 브라우저는 요청한 포맷을 지원하지 않음 - Quagga로 폴백
      stopNativeInternals();
      startQuaggaScanner();
      return;
    }

    engine = 'native';
    markLive();
    engineNote.textContent = '';

    const loop = () => {
      if (engine !== 'native' || !isScanning) return;
      if (nativeVideoEl.readyState >= 2) {
        detector.detect(nativeVideoEl).then((codes) => {
          if (codes && codes.length > 0) {
            const value = codes[0].rawValue;
            const now = Date.now();
            if (value !== lastNativeCode || now - lastNativeAt > 1200) {
              lastNativeCode = value;
              lastNativeAt = now;
              onBarcodeDetected(value);
            }
          }
        }).catch(() => {});
      }
      nativeLoopId = requestAnimationFrame(loop);
    };
    nativeLoopId = requestAnimationFrame(loop);
  }

  function stopNativeInternals() {
    if (nativeLoopId) cancelAnimationFrame(nativeLoopId);
    nativeLoopId = null;
    if (nativeStream) {
      nativeStream.getTracks().forEach((t) => t.stop());
      nativeStream = null;
    }
    nativeVideoEl = null;
    interactiveEl.innerHTML = '';
    lastNativeCode = '';
  }

  function stopNativeScanner() {
    stopNativeInternals();
    resetToggle();
    showPlaceholder('카메라를 시작하면<br>가운데 라인 위에 스캔 값이 표시됩니다', false);
  }

  // ---- Engine B: QuaggaJS (BarcodeDetector 미지원 브라우저용 폴백) ----

  function onQuaggaDetected(result) {
    const code = result && result.codeResult && result.codeResult.code;
    if (code) onBarcodeDetected(code);
  }

  function startQuaggaScanner() {
    engineNote.textContent = '호환 모드로 스캔 중 (일부 구형 브라우저)';
    Quagga.init({
      inputStream: {
        name: 'Live',
        type: 'LiveStream',
        target: interactiveEl,
        constraints: {
          width: { ideal: 1280 },
          height: { ideal: 960 },
          facingMode: { ideal: 'environment' }
        }
      },
      decoder: {
        readers: ['code_128_reader', 'ean_reader', 'ean_8_reader', 'code_39_reader']
      },
      locate: true
    }, function (err) {
      if (err) {
        console.error(err);
        showPlaceholder(describeCameraError(err), true);
        resetToggle();
        return;
      }
      engine = 'quagga';
      Quagga.start();
      markLive();
    });

    Quagga.onDetected(onQuaggaDetected);
  }

  function stopQuaggaScanner() {
    Quagga.offDetected(onQuaggaDetected);
    Quagga.stop();
    resetToggle();
    showPlaceholder('카메라를 시작하면<br>가운데 라인 위에 스캔 값이 표시됩니다', false);
    engineNote.textContent = '';
  }

  function startScanner() {
    if (isScanning) return;
    if (hasNativeDetector) startNativeScanner();
    else startQuaggaScanner();
  }

  function stopScanner() {
    if (!isScanning) return;
    if (engine === 'native') stopNativeScanner();
    else stopQuaggaScanner();
    engine = null;
  }

  toggleBtn.addEventListener('click', () => {
    if (isScanning) stopScanner();
    else startScanner();
  });
</script>
</body>
</html>
